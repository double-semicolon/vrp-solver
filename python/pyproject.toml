[project]
name = "vrp"
version = "0.1.0"
description = "Capacitated vehicle routing problem solver, grown from exact search"
authors = [
    { name = "double-semicolon", email = "74241443+double-semicolon@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
