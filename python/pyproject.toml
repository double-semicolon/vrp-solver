[project]
name = "vrp"
version = "0.1.0"
description = "Capacitated vehicle routing problem solver, grown from exact search"
authors = [
    { name = "double-semicolon", email = "74241443+double-semicolon@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vrp = "vrp.cli:main"

# 作図だけが使う。core (探索と JSON) は標準ライブラリだけで動く。
#   uv sync --extra viz
# 開発時はテストのために dev グループにも入れてある。
[project.optional-dependencies]
viz = [
    "matplotlib>=3.10",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# gain の式が壊れると「改善した」と判定し続けて 2-opt のループが終わらない。
# 落ちるべきテストが止まったままにならないよう、1 テストごとに打ち切る。
# 最も遅いテスト (toy8 の独立オラクル) が 8 秒ほどなので、余裕を見て 60 秒。
timeout = 60
